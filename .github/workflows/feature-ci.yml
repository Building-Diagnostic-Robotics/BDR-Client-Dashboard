name: Feature Branch CI

on:
  pull_request:
    branches:
      - dev
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.gitignore'
      - 'audit-findings.md'
  push:
    branches-ignore:
      - main
      - dev
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.gitignore'
      - 'audit-findings.md'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test & Quality Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck all workspaces
        run: |
          npm run typecheck
          npm run typecheck:e2e

      - name: Run unit & contract tests
        run: npm run test

      - name: Build all workspaces
        run: npm run build

      - name: Install Playwright browsers
        run: |
          for attempt in 1 2 3; do
            if npx playwright install --with-deps chromium webkit; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Playwright installation failed after 3 attempts." >&2
              exit 1
            fi
            echo "Retrying Playwright install in 5s (attempt $attempt failed)..."
            sleep 5
          done

      - name: Verify Playwright browser startup
        run: |
          node --input-type=module <<'NODE'
          import { chromium, webkit } from '@playwright/test';
          for (const browserType of [chromium, webkit]) {
            console.log(`Launching ${browserType.name()}...`);
            const browser = await browserType.launch({ headless: true });
            await browser.close();
            console.log(`${browserType.name()} startup succeeded.`);
          }
          NODE

      - name: Run local Playwright E2E suite
        run: npm run test:e2e

      - name: Synthesize CDK templates
        run: |
          npm run cdk:dev:synth
          npm run cdk:prod:synth
