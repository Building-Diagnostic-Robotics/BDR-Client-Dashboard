name: Feature Branch CI

on:
  pull_request:
    branches:
      - dev
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.gitignore'
      - 'audit-findings.md'
  push:
    branches-ignore:
      - main
      - dev
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.gitignore'
      - 'audit-findings.md'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test & Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck all workspaces
        run: |
          npm run typecheck
          npm run typecheck:e2e

      - name: Run unit & contract tests
        run: npm run test

      - name: Build all workspaces
        run: npm run build

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: |
          for i in 1 2 3; do
            npx playwright install --with-deps chromium webkit && break || (echo "Retrying Playwright install in 5s (attempt $i)..." && sleep 5)
          done

      - name: Run local Playwright E2E suite
        run: npm run test:e2e

      - name: Synthesize CDK templates
        run: |
          npm run cdk:dev:synth
          npm run cdk:prod:synth
